services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Host Nginx is the public entry point; keep the app port private.
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ${STORAGE_PATH:-./storage}:/app/storage
      - ${UPLOADS_PATH:-./public/uploads}:/app/public/uploads
      - ${BACKUPS_PATH:-./backups}:/app/backups
      - ${BACKUPS_PATH:-./backups}:/data/backups

  db-migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
